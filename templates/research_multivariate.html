{% extends "research_base.html" %}
{% block title %}Multivariate Lab{% endblock %}
{% block heading %}Multivariate Lab{% endblock %}
{% block body %}
<section class="labs-card labs-shell" data-lab-page="multivariate" data-lab-endpoint="multivariate">
  <div class="labs-toolbar">
    <button class="labs-run-btn" type="button" data-lab-action="run">Run Multivariate Lab</button>
  </div>

  <div class="labs-status" data-lab-status>Loading multivariate diagnostics…</div>
  <div class="labs-summary-grid" data-lab-summary></div>
  <div class="labs-chart-grid" data-lab-chart></div>
  <div class="labs-table-wrap" data-lab-table></div>
</section>
{% endblock %}
