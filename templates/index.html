<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data Analysis – Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #ffffff; --text: #0f172a; --muted: #475569; --card: #f8fafc; --border: #e2e8f0; --accent: #0ea5e9; --button-text: #ffffff;
    }
    :root[data-theme="dark"] {
      --bg: #0b1220; --text: #e5e7eb; --muted: #9ca3af; --card: #111827; --border: #1f2937; --accent: #38bdf8; --button-text: #0b1220;
    }
    html, body { background: var(--bg); color: var(--text); }
    .topbar { display:flex; align-items:center; gap:10px; padding:10px 0; }
    .spacer { flex: 1; }
    .btn { display:inline-block; padding:8px 12px; border:1px solid var(--border); background: var(--accent); color: var(--button-text); border-radius:6px; text-decoration:none; cursor:pointer; }
    .btn.secondary { background: transparent; color: var(--text); }
    .card { background: var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; max-width: 800px; }
    form { display: grid; gap: 12px; }
    input[type="file"], input[type="number"], input[type="text"], select, button {
      color: var(--text); background: var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px;
    }
    label { color: var(--muted); display: grid; gap: 6px; }
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    legend { color: var(--muted); padding: 0 6px; }
  </style>
  <script>
    (function() {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      window.toggleTheme = function() {
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        const next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = next === 'light' ? 'Dark mode' : 'Light mode';
      };
      window.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = (localStorage.getItem('theme') || 'light') === 'light' ? 'Dark mode' : 'Light mode';
      });
    })();
  </script>
</head>
<body>
  <div class="topbar">
    <h2 style="margin:0;">Data Analysis – Upload</h2>
    <div class="spacer"></div>
    <button id="themeToggle" class="btn secondary" type="button" onclick="toggleTheme()">Dark mode</button>
  </div>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash" style="list-style:none; padding:0; margin:0 0 1rem 0;">
        {% for msg in messages %}
          <li style="background: var(--card); border:1px solid var(--border); padding:.5rem .75rem; border-radius:6px; margin-bottom:.5rem;">
            {{ msg }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <div class="card">
    <h2>Upload a dataset</h2>
    <form method="post" enctype="multipart/form-data">
      <label>Choose file
        <input type="file" name="file" required />
      </label>

      <fieldset>
        <legend>Options</legend>

        <label>Forecast horizon (steps)
          <input type="number" name="forecast_horizon" min="10" max="240" value="40" />
        </label>

        <label>Anomaly contamination (0.001–0.2)
          <input type="number" step="0.001" min="0.001" max="0.2" name="contamination" value="0.02" />
        </label>

        <label>Start in view
          <select name="view">
            <option value="overview" selected>Overview</option>
            <option value="static">Static</option>
            <option value="interactive">Interactive</option>
            <option value="forecast">Forecast</option>
            <option value="correlation">Correlation</option>
          </select>
        </label>
      </fieldset>

      <button type="submit" style="margin-top:0.5rem">Analyze</button>
    </form>
  </div>
</body>
</html>
