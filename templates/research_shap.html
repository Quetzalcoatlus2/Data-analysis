{% extends "research_base.html" %}
{% block title %}SHAP Lab{% endblock %}
{% block heading %}SHAP Lab{% endblock %}
{% block body %}
<section class="labs-card labs-shell" data-lab-page="shap" data-lab-endpoint="shap">
  <div class="labs-toolbar">
    <label class="labs-control" data-control="column">
      Target column
      <select data-lab-control="column"></select>
    </label>
    <button class="labs-run-btn" type="button" data-lab-action="run">Run SHAP Lab</button>
  </div>

  <div class="labs-status" data-lab-status>Loading explainability diagnostics…</div>
  <div class="labs-summary-grid" data-lab-summary></div>
  <div class="labs-chart-grid" data-lab-chart></div>
  <div class="labs-table-wrap" data-lab-table></div>
</section>
{% endblock %}
