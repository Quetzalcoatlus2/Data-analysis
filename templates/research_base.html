<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Research Labs{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/research_labs.css') }}" />
</head>
<body>
  <div
    class="labs-wrap"
    id="labs-root"
    data-filename="{{ filename }}"
    data-display-name="{{ display_name }}"
    data-selected-col="{{ selected_col }}"
    data-active-lab="{{ active_lab }}"
    data-forecast-pct="{{ forecast_pct }}"
    data-contamination="{{ contamination }}"
  >
    <nav class="labs-nav labs-card">
      <a class="labs-nav-link" href="{{ url_for('pages.analyze_file', filename=filename, display=display_name, selected_col=selected_col) }}">Back to analysis</a>
      <a class="labs-nav-link{% if active_lab == 'hub' %} is-active{% endif %}" href="{{ url_for('pages.labs_hub', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Hub</a>
      <a class="labs-nav-link{% if active_lab == 'forecast' %} is-active{% endif %}" href="{{ url_for('pages.labs_forecast_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Forecast</a>
      <a class="labs-nav-link{% if active_lab == 'anomaly' %} is-active{% endif %}" href="{{ url_for('pages.labs_anomaly_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Anomaly</a>
      <a class="labs-nav-link{% if active_lab == 'quality' %} is-active{% endif %}" href="{{ url_for('pages.labs_quality_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Quality</a>
      <a class="labs-nav-link{% if active_lab == 'change-points' %} is-active{% endif %}" href="{{ url_for('pages.labs_change_point_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Change points</a>
      <a class="labs-nav-link{% if active_lab == 'conformal' %} is-active{% endif %}" href="{{ url_for('pages.labs_conformal_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Conformal</a>
      <a class="labs-nav-link{% if active_lab == 'shap' %} is-active{% endif %}" href="{{ url_for('pages.labs_shap_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">SHAP</a>
      <a class="labs-nav-link{% if active_lab == 'multivariate' %} is-active{% endif %}" href="{{ url_for('pages.labs_multivariate_lab', filename=filename, display=display_name, column=selected_col, forecast_pct=forecast_pct, contamination=contamination) }}">Multivariate</a>
    </nav>

    <section class="labs-card labs-hero">
      <h1 class="labs-title">{% block heading %}Research Labs{% endblock %}</h1>
      <p class="labs-subtitle">
        Dataset: <code>{{ display_name }}</code>
        {% if selected_col %}
          · Selected column: <code>{{ selected_col }}</code>
        {% endif %}
      </p>
    </section>

    {% block body %}{% endblock %}
  </div>

  <script src="{{ url_for('static', filename='js/research_labs.js') }}" defer></script>
</body>
</html>
