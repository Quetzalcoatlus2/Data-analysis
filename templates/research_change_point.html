{% extends "research_base.html" %}
{% block title %}Change-point Lab{% endblock %}
{% block heading %}Change-point Lab{% endblock %}
{% block body %}
<section class="labs-card labs-shell" data-lab-page="change-points" data-lab-endpoint="change-points">
  <div class="labs-toolbar">
    <label class="labs-control" data-control="column">
      Column
      <select data-lab-control="column"></select>
    </label>
    <button class="labs-run-btn" type="button" data-lab-action="run">Run Change-point Lab</button>
  </div>

  <div class="labs-status" data-lab-status>Loading change-point diagnostics…</div>
  <div class="labs-summary-grid" data-lab-summary></div>
  <div class="labs-chart-grid" data-lab-chart></div>
  <div class="labs-table-wrap" data-lab-table></div>
</section>
{% endblock %}
