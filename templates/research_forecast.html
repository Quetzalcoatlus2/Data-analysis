{% extends "research_base.html" %}
{% block title %}Forecast Lab{% endblock %}
{% block heading %}Forecast Lab{% endblock %}
{% block body %}
<section class="labs-card labs-shell" data-lab-page="forecast" data-lab-endpoint="forecast">
  <div class="labs-toolbar">
    <label class="labs-control" data-control="column">
      Column
      <select data-lab-control="column"></select>
    </label>
    <label class="labs-control" data-control="forecast_pct">
      Forecast %
      <input data-lab-control="forecast_pct" type="number" min="0" max="0.5" step="0.01" value="{{ forecast_pct }}" />
    </label>
    <label class="labs-control" data-control="contamination">
      Contamination
      <input data-lab-control="contamination" type="number" min="0.001" max="0.2" step="0.001" value="{{ contamination }}" />
    </label>
    <button class="labs-run-btn" type="button" data-lab-action="run">Run Forecast Lab</button>
  </div>

  <div class="labs-status" data-lab-status>Loading forecast diagnostics…</div>
  <div class="labs-summary-grid" data-lab-summary></div>
  <div class="labs-chart-grid" data-lab-chart></div>
  <div class="labs-table-wrap" data-lab-table></div>
</section>
{% endblock %}
